<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول تمارين الدامبل المنزلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --bg2: #111318;
    --bg3: #181c23;
    --card: #1a1f28;
    --card2: #1f2533;
    --accent: #00e5a0;
    --accent2: #00b87a;
    --accent3: #00ffc2;
    --text: #f0f4f8;
    --muted: #d8e2ee;
    --muted2: #b8c8d8;
    --border: rgba(0,229,160,0.12);
    --border2: rgba(0,229,160,0.25);
    --rest-col: #2a2030;
    --rest-accent: #b06cff;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG Pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(0,229,160,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 10% 80%, rgba(0,184,122,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 820px; margin: 0 auto; padding: 0 16px 80px; position: relative; z-index: 1; }

  /* HEADER */
  header {
    padding: 40px 0 32px;
    text-align: center;
  }
  .logo-ring {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
    box-shadow: 0 0 24px rgba(0,229,160,0.2);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 24px rgba(0,229,160,0.2); }
    50% { box-shadow: 0 0 40px rgba(0,229,160,0.4); }
  }
  header h1 {
    font-size: 28px; font-weight: 900;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  header p { font-size: 14px; color: var(--muted); margin-top: 6px; font-weight: 300; }

  /* WEEK STRIP */
  .week-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 28px;
  }
  .day-pill {
    background: var(--bg3);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .day-pill:hover { border-color: var(--border2); }
  .day-pill.active {
    background: var(--accent);
    border-color: var(--accent);
  }
  .day-pill.rest-day { border-color: rgba(176,108,255,0.15); }
  .day-pill.rest-day.active { background: var(--rest-accent); border-color: var(--rest-accent); }
  .day-pill .d-short { font-size: 12px; font-weight: 700; color: var(--muted); }
  .day-pill.active .d-short { color: #000; }
  .day-pill.rest-day .d-short { color: #b06cff; }
  .day-pill.rest-day.active .d-short { color: #fff; }
  .day-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted2); margin: 4px auto 0; }
  .day-pill.active .day-dot { background: rgba(0,0,0,0.3); }
  .day-pill.done .day-dot { background: var(--accent); }

  /* DAY HEADER */
  .day-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 24px;
    animation: fadeSlide 0.3s ease;
  }
  @keyframes fadeSlide { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }
  .day-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .day-icon.rest-icon { background: linear-gradient(135deg, #7a3fb0, var(--rest-accent)); }
  .day-title { font-size: 22px; font-weight: 900; }
  .day-meta { font-size: 13px; color: var(--muted); margin-top: 3px; font-weight: 300; }

  /* PROGRESS BAR */
  .progress-wrap { margin-bottom: 24px; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .progress-track {
    height: 5px; background: var(--bg3); border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent3));
    border-radius: 10px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* REST SCREEN */
  .rest-screen {
    text-align: center;
    padding: 60px 20px;
    animation: fadeSlide 0.3s ease;
  }
  .rest-big-icon { font-size: 72px; margin-bottom: 20px; }
  .rest-screen h2 { font-size: 26px; font-weight: 900; color: var(--rest-accent); margin-bottom: 10px; }
  .rest-screen p { font-size: 15px; color: var(--muted); font-weight: 300; line-height: 1.8; }

  /* EXERCISE CARDS */
  .exercises-list { display: flex; flex-direction: column; gap: 10px; }
  .ex-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
    animation: fadeSlide 0.3s ease both;
  }
  .ex-card:nth-child(1) { animation-delay: 0.04s; }
  .ex-card:nth-child(2) { animation-delay: 0.08s; }
  .ex-card:nth-child(3) { animation-delay: 0.12s; }
  .ex-card:nth-child(4) { animation-delay: 0.16s; }
  .ex-card:nth-child(5) { animation-delay: 0.20s; }
  .ex-card:nth-child(6) { animation-delay: 0.24s; }
  .ex-card:nth-child(7) { animation-delay: 0.28s; }
  .ex-card.open { border-color: var(--border2); }
  .ex-card.all-done { border-color: rgba(0,229,160,0.35); }

  .ex-header {
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .ex-header:hover { background: rgba(255,255,255,0.02); }

  .ex-badge {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--accent);
    flex-shrink: 0; transition: all 0.2s;
  }
  .ex-card.all-done .ex-badge { background: var(--accent); color: #000; border-color: var(--accent); }

  .ex-label { flex: 1; min-width: 0; }
  .ex-name {
    font-size: 15px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ex-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .ex-arrow {
    color: var(--muted2); font-size: 18px;
    transition: transform 0.25s; flex-shrink: 0;
  }
  .ex-card.open .ex-arrow { transform: rotate(180deg); }

  /* EXPANDED BODY */
  .ex-body { display: none; padding: 0 16px 16px; }
  .ex-card.open .ex-body { display: block; }

  /* VIDEO SECTION */
  .video-section { margin-bottom: 14px; }
  .video-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 500; }
  .video-row { display: flex; gap: 8px; }
  .video-input {
    flex: 1;
    background: var(--bg3);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    transition: border-color 0.2s;
    direction: ltr;
  }
  .video-input::placeholder { color: var(--muted2); }
  .video-input:focus { outline: none; border-color: var(--accent2); }
  .save-btn {
    background: var(--accent);
    border: none; border-radius: 10px;
    padding: 9px 16px;
    font-size: 13px; font-weight: 700;
    color: #000;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Tajawal', sans-serif;
    white-space: nowrap;
  }
  .save-btn:hover { background: var(--accent3); transform: scale(1.02); }
  .video-embed-wrap { margin-top: 10px; border-radius: 12px; overflow: hidden; }
  .video-embed-wrap iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
  .video-link-display {
    margin-top: 8px; padding: 8px 12px;
    background: var(--bg3); border-radius: 10px;
    font-size: 12px;
  }
  .video-link-display a { color: var(--accent); text-decoration: none; direction: ltr; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .video-link-display a:hover { text-decoration: underline; }

  /* DIVIDER */
  .ex-divider { height: 1px; background: var(--border); margin: 12px 0; }

  /* SETS GRID */
  .sets-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
  .sets-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
  .set-tile {
    background: var(--bg3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  .set-tile:hover:not(.done-tile):not(.locked-tile) { border-color: var(--border2); background: var(--card2); }
  .set-tile.active-tile {
    border-color: var(--accent);
    background: rgba(0,229,160,0.07);
    box-shadow: 0 0 14px rgba(0,229,160,0.12);
  }
  .set-tile.done-tile {
    border-color: rgba(0,229,160,0.3);
    background: rgba(0,229,160,0.08);
  }
  .set-tile.locked-tile { opacity: 0.4; cursor: not-allowed; }
  .tile-num { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .tile-reps { font-size: 20px; font-weight: 900; color: var(--text); }
  .set-tile.active-tile .tile-reps { color: var(--accent); }
  .set-tile.done-tile .tile-reps { color: var(--accent2); }
  .tile-status { font-size: 11px; color: var(--muted2); margin-top: 4px; }
  .set-tile.active-tile .tile-status { color: var(--accent); }
  .set-tile.done-tile .tile-status { color: var(--accent2); }

  .all-done-badge {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 12px;
    padding: 10px;
    background: rgba(0,229,160,0.08);
    border: 1px solid rgba(0,229,160,0.25);
    border-radius: 10px;
    font-size: 13px; font-weight: 700; color: var(--accent);
  }

  /* TIMER OVERLAY */
  #timerOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 999;
    align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  #timerOverlay.show { display: flex; }
  .timer-box {
    background: var(--card);
    border: 1px solid var(--border2);
    border-radius: 24px;
    padding: 40px 48px;
    text-align: center;
    min-width: 280px;
    box-shadow: 0 0 60px rgba(0,229,160,0.1);
  }
  .timer-title { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
  .timer-next { font-size: 13px; color: var(--muted2); margin-bottom: 20px; }
  .timer-ring {
    width: 120px; height: 120px; margin: 0 auto 24px;
    position: relative;
  }
  .timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer-ring circle {
    fill: none; stroke-width: 6;
    stroke-linecap: round;
  }
  .ring-bg { stroke: var(--bg3); }
  .ring-fill { stroke: var(--accent); transition: stroke-dashoffset 1s linear; }
  .timer-num-big {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 900; color: var(--accent);
    transform: rotate(0deg);
  }
  .timer-skip {
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 10px 28px;
    font-size: 14px; color: var(--muted);
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    transition: all 0.15s;
  }
  .timer-skip:hover { background: var(--bg3); color: var(--text); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 10px; }

  @media (max-width: 500px) {
    .week-strip { gap: 4px; }
    .day-pill { padding: 8px 2px; border-radius: 10px; }
    .d-short { font-size: 11px; }
    header h1 { font-size: 22px; }
    .timer-box { padding: 28px 28px; min-width: 240px; }
  }

  .yt-preview {
    margin-top: 10px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    aspect-ratio: 16/9;
    background: var(--bg3);
    display: flex; align-items: center; justify-content: center;
  }
  .yt-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .yt-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.35);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .yt-preview:hover .yt-overlay { background: rgba(0,0,0,0.5); }
  .yt-play-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: #ff0000;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: transform 0.15s;
  }
  .yt-preview:hover .yt-play-btn { transform: scale(1.08); }
  .yt-open-label {
    font-size: 13px; font-weight: 700; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .yt-preview.no-thumb { min-height: 80px; }

  .reset-section {
    margin-top: 48px;
    padding: 24px 0 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
    text-align: center;
  }
  .reset-btn {
    background: transparent;
    border: 1px solid rgba(255,80,80,0.35);
    border-radius: 14px;
    padding: 14px 32px;
    color: #ff6b6b;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }
  .reset-btn:hover { background: rgba(255,80,80,0.08); border-color: rgba(255,80,80,0.6); }
  .reset-confirm {
    display: none;
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .reset-confirm.show { display: block; }
  .reset-yes {
    background: #ff4444;
    border: none;
    border-radius: 10px;
    padding: 9px 22px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    margin: 10px 6px 0;
    transition: all 0.15s;
  }
  .reset-yes:hover { background: #cc2222; }
  .reset-no {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 22px;
    color: var(--muted);
    font-size: 14px;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    margin: 10px 6px 0;
    transition: all 0.15s;
  }
  .reset-no:hover { background: var(--bg3); }

  /* CELEBRATION */
  #celebrationOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    align-items: center; justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
  }
  #celebrationOverlay.show { display: flex; }
  .celeb-title {
    font-size: 64px; font-weight: 900;
    background: linear-gradient(135deg, #00e5a0, #00ffc2, #ffe600, #ff6b35);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: celebPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    line-height: 1.1; margin-bottom: 12px;
  }
  .celeb-sub {
    font-size: 22px; color: #fff; font-weight: 700;
    animation: celebPop 0.6s 0.15s cubic-bezier(0.34,1.56,0.64,1) both;
    margin-bottom: 8px;
  }
  .celeb-emoji {
    font-size: 48px;
    animation: celebPop 0.6s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    margin-bottom: 32px;
  }
  .celeb-close {
    background: var(--accent);
    border: none; border-radius: 14px;
    padding: 14px 40px;
    font-size: 16px; font-weight: 900; color: #000;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    animation: celebPop 0.6s 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    transition: transform 0.15s;
  }
  .celeb-close:hover { transform: scale(1.05); }
  @keyframes celebPop {
    from { opacity:0; transform: scale(0.5); }
    to { opacity:1; transform: scale(1); }
  }
  #confettiCanvas {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 9998;
  }

  .quick-reset-btn {
    margin-top: 14px;
    background: transparent;
    border: 1px solid rgba(255,80,80,0.3);
    border-radius: 20px;
    padding: 7px 20px;
    color: #ff8080;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .quick-reset-btn:hover { background: rgba(255,80,80,0.1); border-color: rgba(255,80,80,0.6); }
</style>
</head>
<body>

<div id="timerOverlay">
  <div class="timer-box">
    <div class="timer-title">وقت الراحة</div>
    <div class="timer-next" id="timerNext"></div>
    <div class="timer-ring">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54"/>
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="54"
          stroke-dasharray="339.3" stroke-dashoffset="0"/>
      </svg>
      <div class="timer-num-big" id="timerNum">30</div>
    </div>
    <button class="timer-skip" onclick="skipTimer()">تخطي ←</button>
  </div>
</div>

<div class="container">
  <header>
    <div class="logo-ring">🏋️</div>
    <h1>جدول تمارين الدامبل المنزلي</h1>
    <p>٦ تمارين · ٣ جلسات: ٨-١٠-١٢ عدة · ٣٠ ثانية راحة</p>
    <button class="quick-reset-btn" onclick="showResetConfirm()">🔄 إعادة التمارين</button>
    <div class="reset-confirm" id="resetConfirm">
      <div>هل أنت متأكد؟ سيتم مسح كل التقدم</div>
      <button class="reset-yes" onclick="resetAll()">نعم، ابدأ من جديد</button>
      <button class="reset-no" onclick="hideResetConfirm()">إلغاء</button>
    </div>
  </header>

  <div class="week-strip" id="weekStrip"></div>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span id="progressText">التقدم اليومي</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div id="dayView"></div>
</div>

<script>
const DAYS = [
  {
    key:'sun', short:'الأحد', icon:'💪', rest:false,
    name:'تمرين يوم الأحد', color:'accent',
    exercises:[
      'الصدر الأوسط','الصدر العلوي','الكتف الأمامي والجانبي',
      'الكتف الجانبي','الترايسبس (الرأس الطويل)','الترايسبس (العضلة ثلاثية الرؤوس)'
    ]
  },
  {
    key:'mon', short:'الاثنين', icon:'💪', rest:false,
    name:'تمرين يوم الاثنين', color:'accent',
    exercises:[
      'الظهر العريض','الظهر العريض','منتصف الظهر',
      'الكتف الخلفي','البايسبس','البايسبس والساعد'
    ]
  },
  {
    key:'tue', short:'الثلاثاء', icon:'🌙', rest:true,
    name:'يوم راحة', exercises:[]
  },
  {
    key:'wed', short:'الأربعاء', icon:'💪', rest:false,
    name:'تمرين يوم الأربعاء', color:'accent',
    exercises:[
      'الصدر الأوسط','الصدر العلوي','الكتف الأمامي والجانبي',
      'الكتف الجانبي','الترايسبس (الرأس الطويل)','الترايسبس (العضلة ثلاثية الرؤوس)'
    ]
  },
  {
    key:'thu', short:'الخميس', icon:'💪', rest:false,
    name:'تمرين يوم الخميس', color:'accent',
    exercises:[
      'الظهر العريض','الظهر العريض','منتصف الظهر',
      'الكتف الخلفي','البايسبس','البايسبس والساعد'
    ]
  },
  {
    key:'fri', short:'الجمعة', icon:'🌙', rest:true,
    name:'يوم راحة', exercises:[]
  },
  {
    key:'sat', short:'السبت', icon:'🌙', rest:true,
    name:'يوم راحة', exercises:[]
  }
];

const SETS = 3, REPS = [10, 10, 10], REST_SEC = 45;
const CIRC = 2 * Math.PI * 54;

function loadState() {
  try { return JSON.parse(localStorage.getItem('wb2_state') || 'null') || {}; } catch(e){ return {}; }
}
function saveState() {
  try { localStorage.setItem('wb2_state', JSON.stringify(state)); } catch(e){}
}

let state = loadState();
if(!state.activeDay && state.activeDay !== 0) state.activeDay = 0;
if(!state.sets) state.sets = {};
if(!state.videos) state.videos = {};
// الأحد والأربعاء - نفس التمارين
const sunWedVideos = [
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Sun_Wen/1.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Sun_Wen/2.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Sun_Wen/3.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Sun_Wen/4.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Sun_Wen/5.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Sun_Wen/6.mov',
];
sunWedVideos.forEach((v,i)=>{
  state.videos['sun_'+i] = v;
  state.videos['wed_'+i] = v;
});
// الاثنين والخميس - نفس التمارين
const monThuVideos = [
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Mon_thr/1.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Mon_thr/2.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Mon_thr/3.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Mon_thr/4.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Mon_thr/5.mov',
  'https://github.com/alnaif1/tmareen/raw/refs/heads/Mon_thr/6.mov',
];
monThuVideos.forEach((v,i)=>{
  state.videos['mon_'+i] = v;
  state.videos['thu_'+i] = v;
});
if(!state.openEx) state.openEx = null;
if(!state.names) state.names = {};

let timerInterval = null, timerCB = null;

function startTimer(cb, nextLabel) {
  timerCB = cb;
  let sec = REST_SEC;
  document.getElementById('timerNum').textContent = sec;
  document.getElementById('timerNext').textContent = nextLabel || '';
  document.getElementById('ringFill').style.strokeDashoffset = 0;
  document.getElementById('timerOverlay').classList.add('show');
  timerInterval = setInterval(() => {
    sec--;
    document.getElementById('timerNum').textContent = sec;
    const offset = CIRC * (1 - sec/REST_SEC);
    document.getElementById('ringFill').style.strokeDashoffset = offset;
    if(sec <= 0) skipTimer();
  }, 1000);
}
function skipTimer() {
  clearInterval(timerInterval);
  document.getElementById('timerOverlay').classList.remove('show');
  if(timerCB) { const cb = timerCB; timerCB = null; cb(); }
}

function setKey(dk, ei, si) { return `${dk}_${ei}_${si}`; }
function allSetsKey(dk, ei) { return [0,1,2].every(si => state.sets[setKey(dk,ei,si)]); }
function doneCount(dk) {
  const day = DAYS.find(d=>d.key===dk);
  if(!day||day.rest) return 0;
  return day.exercises.reduce((a,_,ei)=>[0,1,2].filter(si=>state.sets[setKey(dk,ei,si)]).length+a,0);
}
function totalSets(dk) {
  const day = DAYS.find(d=>d.key===dk);
  return day&&!day.rest ? day.exercises.length * SETS : 0;
}

function getExName(dk, ei) {
  const k = `${dk}_${ei}`;
  return state.names[k] || DAYS.find(d=>d.key===dk).exercises[ei];
}
function setExName(dk, ei, val) {
  state.names[`${dk}_${ei}`] = val;
  saveState();
}

function getVideo(dk, ei) { return state.videos[`${dk}_${ei}`] || ''; }
function setVideo(dk, ei, url) { state.videos[`${dk}_${ei}`] = url; saveState(); }

function ytId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function checkDayComplete(dk) {
  const day = DAYS.find(d=>d.key===dk);
  if(!day||day.rest) return false;
  return day.exercises.every((_,ei)=>[0,1,2].every(si=>state.sets[setKey(dk,ei,si)]));
}

function handleSetClick(dk, ei, si) {
  if(state.sets[setKey(dk,ei,si)]) return;
  const prev = si===0 || state.sets[setKey(dk,ei,si-1)];
  if(!prev) return;

  state.sets[setKey(dk,ei,si)] = true;
  saveState();

  const day = DAYS.find(d=>d.key===dk);
  const isLastSet = si === SETS - 1;
  const isLastExercise = ei === day.exercises.length - 1;

  if(!isLastSet) {
    // راحة بين الجلسات
    render();
    startTimer(()=>{ render(); }, `الجلسة ${si+2} من التمرين`);
  } else if(!isLastExercise) {
    // انتهت جلسات هذا التمرين → راحة ثم انتقال للتمرين التالي
    render();
    startTimer(()=>{
      state.openEx = dk + '_' + (ei + 1);
      saveState();
      render();
      setTimeout(()=>{
        const el = document.getElementById('exc_' + dk + '_' + (ei+1));
        if(el) el.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 200);
    }, 'التمرين التالي 💪');
  } else {
    // اكتمل اليوم كله!
    render();
    setTimeout(()=> showCelebration(dk), 500);
  }
}

function renderSets(dk, ei) {
  let html = '<div class="sets-title">الجلسات (٨ - ١٠ - ١٢ عدة)</div><div class="sets-row">';
  for(let si=0;si<SETS;si++){
    const done = state.sets[setKey(dk,ei,si)];
    const prevDone = si===0 || state.sets[setKey(dk,ei,si-1)];
    const isActive = !done && prevDone;
    const locked = !done && !prevDone;
    let cls = 'set-tile';
    if(done) cls += ' done-tile';
    else if(isActive) cls += ' active-tile';
    else if(locked) cls += ' locked-tile';
    const statusText = done ? '✓ تمت' : isActive ? 'اضغط' : '🔒';
    html += `<div class="${cls}" onclick="handleSetClick('${dk}',${ei},${si})">
      <div class="tile-num">الجلسة ${si+1}</div>
      <div class="tile-reps">${REPS[si]}</div>
      <div class="tile-status">${statusText}</div>
    </div>`;
  }
  html += '</div>';
  if(allSetsKey(dk,ei)) {
    html += '<div class="all-done-badge">✓ اكتملت جميع الجلسات</div>';
  }
  return html;
}

function isDirectVideo(url) {
  return /\.(mp4|webm|mov|m4v)([?#].*)?$/i.test(url);
}

function renderVideoSection(dk, ei) {
  const url = getVideo(dk,ei);
  const vid = url ? ytId(url) : null;
  let previewHtml = '';
  if(url && isDirectVideo(url)) {
    previewHtml = `<div class="video-embed-wrap">
        <div style="position:relative;border-radius:12px;overflow:hidden;background:#000;"><div style="position:absolute;top:0;right:0;width:90px;height:90px;background:#000;z-index:2;pointer-events:none;border-bottom-left-radius:8px;"></div>
        <video controls autoplay muted playsinline preload="auto" loop style="width:100%;display:block;max-height:320px;">
          <source src="${url}" type="video/mp4">
        </video>
        
      </div>
      </div>`;
  } else if(url && vid) {
    const thumb = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
    previewHtml = `<div class="yt-preview" onclick="window.open('${url}','_blank')">
        <img src="${thumb}" alt="thumbnail" onerror="this.parentElement.classList.add('no-thumb')">
        <div class="yt-overlay"><div class="yt-play-btn">▶</div><div class="yt-open-label">افتح في يوتيوب</div></div>
      </div>`;
  } else if(url) {
    previewHtml = `<div class="video-link-display"><a href="${url}" target="_blank" rel="noopener">🔗 افتح الرابط</a></div>`;
  }
  return `<div class="video-section">
    <div class="video-label">رابط فيديو التمرين</div>
    <div class="video-row">
      <input class="video-input" type="url" placeholder="رابط MP4 أو يوتيوب..." value="${url}" id="vi_${dk}_${ei}">
      <button class="save-btn" onclick="saveVideo('${dk}',${ei})">حفظ</button>
    </div>
    ${previewHtml}
  </div>`;
}

function saveVideo(dk, ei) {
  const inp = document.getElementById(`vi_${dk}_${ei}`);
  if(inp) { setVideo(dk, ei, inp.value.trim()); render(); }
}

function renderDay() {
  const day = DAYS[state.activeDay];
  const dv = document.getElementById('dayView');

  if(day.rest) {
    document.getElementById('progressWrap').style.display = 'none';
    dv.innerHTML = `<div class="rest-screen">
      <div class="rest-big-icon">🌙</div>
      <h2>يوم راحة</h2>
      <p>دع عضلاتك تتعافى وتنمو<br>غداً أقوى 💪</p>
    </div>`;
    return;
  }

  document.getElementById('progressWrap').style.display = 'block';
  const done = doneCount(day.key);
  const total = totalSets(day.key);
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('progressText').textContent = `${done} / ${total} جلسة مكتملة`;

  let html = '<div class="exercises-list">';
  day.exercises.forEach((_, ei) => {
    const name = getExName(day.key, ei);
    const isOpen = state.openEx === `${day.key}_${ei}`;
    const allDone = allSetsKey(day.key, ei);
    const doneSi = [0,1,2].filter(si=>state.sets[setKey(day.key,ei,si)]).length;

    html += `<div class="ex-card${isOpen?' open':''}${allDone?' all-done':''}" id="exc_${day.key}_${ei}">
      <div class="ex-header" onclick="toggleEx('${day.key}',${ei})">
        <div class="ex-badge">${allDone ? '✓' : ei+1}</div>
        <div class="ex-label">
          <div class="ex-name" title="${name}">${name}</div>
          <div class="ex-sub">${SETS} جلسات: ٨-١٠-١٢ عدة &nbsp;·&nbsp; ${doneSi}/${SETS} مكتمل</div>
        </div>
        <div class="ex-arrow">▾</div>
      </div>`;

    if(isOpen) {
      html += `<div class="ex-body">
        ${renderVideoSection(day.key, ei)}
        <div class="ex-divider"></div>
        ${renderSets(day.key, ei)}
      </div>`;
    }
    html += `</div>`;
  });
  html += '</div>';

  const iconCls = 'day-icon';
  dv.innerHTML = `
    <div class="day-header">
      <div class="${iconCls}">${day.icon}</div>
      <div>
        <div class="day-title">${day.name}</div>
        <div class="day-meta">${day.exercises.length} تمارين · دامبليز فقط</div>
      </div>
    </div>
    ${html}`;
}

function toggleEx(dk, ei) {
  const k = `${dk}_${ei}`;
  state.openEx = state.openEx === k ? null : k;
  saveState();
  render();
}

function renderStrip() {
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = DAYS.map((d,i)=>{
    const done = !d.rest && doneCount(d.key) === totalSets(d.key) && totalSets(d.key) > 0;
    return `<div class="day-pill${i===state.activeDay?' active':''}${d.rest?' rest-day':''}${done?' done':''}" onclick="switchDay(${i})">
      <div class="d-short">${d.short}</div>
      <div class="day-dot"></div>
    </div>`;
  }).join('');
}

function switchDay(i) {
  state.activeDay = i;
  state.openEx = null;
  saveState();
  render();
}

function render() {
  renderStrip();
  renderDay();
}

render();
</script>

<script>
function showResetConfirm() {
  document.getElementById('resetConfirm').classList.add('show');
}
function hideResetConfirm() {
  document.getElementById('resetConfirm').classList.remove('show');
}
function resetAll() {
  try { localStorage.removeItem('wb2_state'); } catch(e){}
  location.reload();
}
</script>

<div id="celebrationOverlay">
  <div class="celeb-title" id="celebTitle">بطل! 🏆</div>
  <div class="celeb-sub" id="celebSub">أكملت تمارين اليوم كاملة!</div>
  <div class="celeb-emoji">🔥💪🎉</div>
  <button class="celeb-close" onclick="closeCelebration()">شكراً، أنا الأفضل! 😎</button>
</div>

<script>
const CELEB_MESSAGES = [
  { title: 'وحش! 🔥', sub: 'ما في أحد مثلك، أكملت اليوم كله!' },
  { title: 'بطل! 🏆', sub: 'أسد! أكملت جميع التمارين!' },
  { title: 'أسطورة! ⚡', sub: 'الألم مؤقت، الفخر إلى الأبد!' },
  { title: 'ملك! 💎', sub: 'تمرين كامل 100%، ما شاء الله!' },
  { title: 'قوة خرافية! 💥', sub: 'أكملت اليوم كله بدون توقف!' },
];

function showCelebration(dk) {
  const msg = CELEB_MESSAGES[Math.floor(Math.random() * CELEB_MESSAGES.length)];
  document.getElementById('celebTitle').textContent = msg.title;
  document.getElementById('celebSub').textContent = msg.sub;
  document.getElementById('celebrationOverlay').classList.add('show');
  startConfetti();
}

function closeCelebration() {
  document.getElementById('celebrationOverlay').classList.remove('show');
  stopConfetti();
}

// CONFETTI
let confettiAnim = null;
let confettiParticles = [];

function startConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  confettiParticles = [];
  const colors = ['#00e5a0','#ffe600','#ff6b35','#ff3cac','#00cfff','#a855f7','#fff'];

  for(let i=0;i<180;i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random()*10+5,
      h: Math.random()*6+3,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      vx: (Math.random()-0.5)*4,
      vy: Math.random()*4+2,
      vr: (Math.random()-0.5)*6,
      shape: Math.random()>0.5?'rect':'circle',
    });
  }

  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParticles.forEach(p=>{
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.fillStyle = p.color;
      if(p.shape==='circle') {
        ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill();
      } else {
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      }
      ctx.restore();
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if(p.y > canvas.height+20) { p.y = -20; p.x = Math.random()*canvas.width; }
    });
    confettiAnim = requestAnimationFrame(draw);
  }
  draw();
}

function stopConfetti() {
  if(confettiAnim) cancelAnimationFrame(confettiAnim);
  const canvas = document.getElementById('confettiCanvas');
  canvas.style.display = 'none';
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
</script>
